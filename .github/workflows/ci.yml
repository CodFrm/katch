name: CI

on:
  push:
    branches: [main]
  pull_request:

# 版本全部写死：工具链版本漂移会让「本地全绿、CI 挂」这类问题变成猜谜。
# 升级时连同本地一起升，不要只改这里。
env:
  GOLANGCI_LINT_VERSION: v2.12.2
  PNPM_VERSION: 10.11.0

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: 安装 golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}
      - run: cd frontend && pnpm install --frozen-lockfile
      - run: make lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: make test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      # build 单独成一个 job，为的是让 CGO_ENABLED=0 这道闸每次都真正跑到：
      # 引入 cgo 依赖时这里会编译失败，而 lint 和 test 都发现不了。
      - run: make build
      - name: smoke
        run: make smoke
      - name: 确认产物是静态链接
        run: |
          file bin/katch
          ! ldd bin/katch 2>/dev/null | grep -q "=>" || (echo "产物含动态链接依赖，CGO 可能被意外打开" && exit 1)
