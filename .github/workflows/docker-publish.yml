name: Publish image

# release.yml（打 tag 发版）和 nightly.yml（每日快照）共用的镜像发布流程。
# 抽出来不是为了少写几行，而是为了让这两条路推出去的镜像结构永远一致：
# 它们之前是两份各自维护的复制品，改一边忘一边的代价是「发版镜像有 arm64、
# nightly 没有」这种只在别人的机器上才发作的问题。
#
# 双架构的做法是「各自原生构建 + 合 manifest list」，而不是 QEMU 模拟：
#   1. amd64 与 arm64 分别跑在自己架构的 runner 上，并发，互不等待。
#   2. 两边都不打 tag，只 push by digest——此时仓库里躺着两份无名的 manifest。
#   3. merge 作业把这两个 digest 合成一个 manifest list，tag 打在这个列表上。
# 于是同一个 tag 底下挂着两份 manifest，客户端 pull 时由 registry 按
# Accept 头里的架构挑一份，不需要使用者区分 -amd64 / -arm64 后缀。
#
# 拆成两个 runner 之后就不再需要 setup-qemu-action 了：每个 runner 只构建自己
# 那个架构。多留着它只是每次多花十几秒装 binfmt。

on:
  workflow_call:
    inputs:
      ref:
        description: 要构建的 git ref
        type: string
        required: true
      version:
        description: 写进 buildinfo.Version 的版本号
        type: string
        required: true
      commit:
        description: 写进 buildinfo.Commit 的短号
        type: string
        required: true
      tags:
        description: docker/metadata-action 的 tags 输入，决定 manifest list 上打哪些标签
        type: string
        required: true
    outputs:
      image:
        description: 发布出去的镜像名（不含 tag）
        value: ${{ jobs.merge.outputs.image }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      # 一个架构挂了，另一个也让它跑完：知道「只有 arm64 坏了」比知道「有东西坏了」
      # 更有用，而 merge 作业反正会因为缺 digest 而停下。
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            # public 仓库可以白嫖 GitHub 托管的 arm64 runner。仓库哪天转私有，
            # 这个标签会变成「没有可用 runner」而一直排队，不会报错——届时要么
            # 付费开 larger runner，要么把这一行换回 ubuntu-latest 走 QEMU。
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Resolve the image name
        id: image
        run: |
          # ghcr 的镜像路径必须全小写，而 github.repository 会保留账号的大小写
          # （CodFrm/katch），直接拼上去会被 ghcr 拒掉。bash 的 ${VAR,,} 转小写。
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          # linux/amd64 里的斜杠不能进 artifact 名字，换成横杠。
          echo "key=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"
        env:
          PLATFORM: ${{ matrix.platform }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # 这一步只取 labels（写进镜像 config，ghcr 靠 image.source 把包挂到仓库下面）。
      # 它算出来的 tags 一概不用：这里推的是没有名字的 digest，标签由 merge 作业打在
      # manifest list 上。给单架构 manifest 也打上 tag 的话，两个架构会轮流把同一个
      # tag 覆盖成自己，最后一个推的赢——那正是 manifest list 要解决的问题。
      #
      # tags 输入照样要给，虽然用不到它的输出：metadata-action 的
      # org.opencontainers.image.version 这个 label 是从第一个 tag 推出来的，
      # 不给就会退回默认规则，算出跟 manifest list 上那个对不上的版本号。
      - name: Generate labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: ${{ inputs.tags }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ inputs.version }}
            COMMIT=${{ inputs.commit }}
          # scope 必须按架构分开。gha 缓存是按 scope 覆盖写的，两个并发作业写同一个
          # scope 会互相把对方的缓存冲掉，下次跑两边都是冷的。
          # 用上面那个没有斜杠的 key，别直接拿 matrix.platform 拼缓存键。
          cache-from: type=gha,scope=${{ steps.image.outputs.key }}
          cache-to: type=gha,mode=max,scope=${{ steps.image.outputs.key }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
      - name: Export the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          # 文件名就是内容：merge 作业只需要 digest 本身，不需要文件里有东西。
          touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ steps.image.outputs.key }}
          path: /tmp/digests/*
          # 默认是 warn。digest 丢了而这里只是警告的话，merge 会拿着一个架构去合
          # manifest list，推出去一个悄悄缺了 arm64 的镜像。
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge into a manifest list
    needs: build
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - name: Resolve the image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # flavor 的 latest=auto 是默认值，也是这里要的：tag 触发时 latest 跟着走，
      # 而预发布版本（v0.2.0-rc1）只拿到自己的标签，顶不掉 latest。
      # ANNOTATIONS_LEVELS=index：注解要打在 manifest list 上，不是打在它下面
      # 那两份单架构 manifest 上——被 tag 指着的是列表。
      - name: Generate tags
        id: meta
        uses: docker/metadata-action@v5
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ steps.image.outputs.name }}
          tags: ${{ inputs.tags }}
      - name: Create the manifest list
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          # 逐行读进数组再展开，而不是把 jq 的输出拼成一行命令：标签和注解里都可能
          # 有空格（org.opencontainers.image.description 尤其），拼字符串会在那里裂开。
          args=()
          while IFS= read -r tag; do args+=(--tag "$tag"); done \
            < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          while IFS= read -r annotation; do args+=(--annotation "$annotation"); done \
            < <(jq -r '.annotations[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")

          # 目录里每个文件名都是一个架构的 digest。数量对不上就停：合出一个只有
          # 单架构的 manifest list 不会报错，只会让另一半用户 pull 下来跑不了。
          count=$(find . -type f | wc -l)
          if [ "$count" -ne 2 ]; then
            echo "::error::expected 2 per-platform digests, got $count"
            exit 1
          fi
          for digest in *; do args+=("${IMAGE}@sha256:${digest}"); done

          docker buildx imagetools create "${args[@]}"
      # DOCKER_METADATA_OUTPUT_JSON 是上面的 metadata-action 导出到环境里的，
      # 后续步骤直接读得到。
      - name: Inspect the manifest list
        run: |
          # 取第一个 tag 来看。这一步是给人看的，也是最后一道「两个架构都在里面吗」
          # 的肉眼确认。
          tag=$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          docker buildx imagetools inspect "$tag"
