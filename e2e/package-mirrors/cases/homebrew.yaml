{
  "name": "homebrew-bottle",
  "image": "katch/package-client-homebrew:4.6.20",
  "setup": "set -eu\ncommand -v brew >/dev/null || { echo 'blocked: Homebrew is unavailable in the pinned client image' >&2; exit 69; }\nmkdir -p results client-home",
  "run": "set -eu\nexport HOME=\"$PWD/client-home\"\nexport HOMEBREW_API_DOMAIN=\"${KATCH_URL%/}/formulae.brew.sh/api\"\nexport HOMEBREW_ARTIFACT_DOMAIN=\"${KATCH_URL%/}/registry/ghcr.io\"\nexport HOMEBREW_ARTIFACT_DOMAIN_NO_FALLBACK=1\nexport HOMEBREW_BREW_GIT_REMOTE=\"${KATCH_URL%/}/github.com/Homebrew/brew.git\"\nexport HOMEBREW_CORE_GIT_REMOTE=\"${KATCH_URL%/}/github.com/Homebrew/homebrew-core.git\"\nexport HOMEBREW_NO_AUTO_UPDATE=1\ncase \"$KATCH_PHASE\" in\n  cold) unset HOMEBREW_NO_INSTALL_FROM_API ;;\n  warm)\n    export HOMEBREW_NO_INSTALL_FROM_API=1\n    ;;\n  *) echo \"unsupported Homebrew phase: $KATCH_PHASE\" >&2; exit 64 ;;\nesac\ngit ls-remote \"$HOMEBREW_CORE_GIT_REMOTE\" HEAD > results/core-head\nbrew install jq\nbrew list --versions jq > results/jq-list\nbrew info --json=v2 jq > results/jq.json\nbrew --cellar jq > results/jq-cellar",
  "assert": "set -eu\ntest -s results/jq-list\ntest -s results/jq.json\ntest -s results/jq-cellar\ntest -s results/core-head\ngrep -Eqx 'jq [0-9]+([.][0-9]+)+([._-][A-Za-z0-9]+)*' results/jq-list\njq_version=$(sed -n 's/^jq //p' results/jq-list)\ntest -s \"$(cat results/jq-cellar)/$jq_version/INSTALL_RECEIPT.json\"\njq -e '.formulae[] | select(.name == \"jq\") | .installed | length > 0' results/jq.json >/dev/null",
  "required_upstreams": ["formulae.brew.sh", "ghcr.io", "pkg-containers.githubusercontent.com", "github.com"]
}
