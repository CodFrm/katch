{
  "name": "homebrew-bottle",
  "image": "katch/package-client-homebrew:4.6.20",
  "setup": "set -eu\ncommand -v brew >/dev/null || { echo 'blocked: Homebrew is unavailable in the pinned client image' >&2; exit 69; }\nmkdir -p results client-home",
  "run": "set -eu\nexport HOME=\"$PWD/client-home\"\nexport HOMEBREW_API_DOMAIN=\"${KATCH_URL%/}/formulae.brew.sh/api\"\nexport HOMEBREW_ARTIFACT_DOMAIN=\"${KATCH_URL%/}/registry/ghcr.io\"\nexport HOMEBREW_ARTIFACT_DOMAIN_NO_FALLBACK=1\nexport HOMEBREW_BREW_GIT_REMOTE=\"${KATCH_URL%/}/github.com/Homebrew/brew.git\"\nexport HOMEBREW_CORE_GIT_REMOTE=\"${KATCH_URL%/}/github.com/Homebrew/homebrew-core.git\"\nexport HOMEBREW_NO_AUTO_UPDATE=1\nexport HOMEBREW_NO_INSTALL_FROM_API=1\ncase \"$KATCH_PHASE\" in\n  cold)\n    brew ruby -rjson -e 'require \"api/internal\"; data, = Homebrew::API.fetch_json_api_file(Homebrew::API::Internal.formula_endpoint); entry = data.fetch(\"formulae\").fetch(\"jq\"); raise \"invalid jq formula metadata\" unless entry.is_a?(Hash); version = entry.fetch(\"stable_version\"); source_sha256 = entry.fetch(\"stable_checksum\"); bottle_sha256 = entry.fetch(\"bottle_checksum\"); raise \"invalid jq formula metadata\" unless [version, source_sha256, bottle_sha256].all? { |value| value.is_a?(String) && !value.empty? }; puts JSON.generate({\"name\" => \"jq\", \"version\" => version, \"source_sha256\" => source_sha256, \"bottle_sha256\" => bottle_sha256})' > results/api-jq.json\n    git ls-remote \"$HOMEBREW_CORE_GIT_REMOTE\" HEAD > results/core-head\n    ;;\n  warm) ;;\n  *) echo \"unsupported Homebrew phase: $KATCH_PHASE\" >&2; exit 64 ;;\nesac\nbrew install jq\nbrew list --versions jq > results/jq-list\nbrew info --json=v2 jq > results/jq.json\nbrew --cellar jq > results/jq-cellar",
  "assert": "set -eu\ntest -s results/jq-list\ntest -s results/jq.json\ntest -s results/jq-cellar\nportable_ruby=\"$(brew --repository)/Library/Homebrew/vendor/portable-ruby/current/bin/ruby\"\ntest -x \"$portable_ruby\"\ncase \"$KATCH_PHASE\" in\n  cold)\n    test -s results/api-jq.json\n    test -s results/core-head\n    grep -Eq '^[0-9a-f]{40}[[:space:]]+HEAD$' results/core-head\n    \"$portable_ruby\" -rjson -e 'data = JSON.parse(File.read(ARGV.fetch(0))); exit 1 unless data.is_a?(Hash) && data.keys.sort == [\"bottle_sha256\", \"name\", \"source_sha256\", \"version\"] && data[\"name\"] == \"jq\"; version = data[\"version\"]; exit 1 unless version.is_a?(String) && !version.empty? && !version.include?(\"\\n\"); checksums = data.values_at(\"source_sha256\", \"bottle_sha256\"); exit(checksums.all? { |checksum| checksum.is_a?(String) && /\\A[0-9a-f]{64}\\z/.match?(checksum) } ? 0 : 1)' results/api-jq.json\n    ;;\n  warm)\n    test ! -e results/api-jq.json\n    test ! -e results/core-head\n    ;;\n  *) echo \"unsupported Homebrew phase: $KATCH_PHASE\" >&2; exit 64 ;;\nesac\ngrep -Eqx 'jq [0-9]+([.][0-9]+)+([._-][A-Za-z0-9]+)*' results/jq-list\njq_version=$(\"$portable_ruby\" -rjson -e 'data = JSON.parse(File.read(ARGV.fetch(0))); formulae = data.fetch(\"formulae\"); exit 1 unless formulae.is_a?(Array); matches = formulae.select { |entry| entry.is_a?(Hash) && entry[\"name\"] == \"jq\" }; exit 1 unless matches.length == 1; installed = matches.first[\"installed\"]; exit 1 unless installed.is_a?(Array) && installed.length == 1 && installed.first.is_a?(Hash); version = installed.first[\"version\"]; exit 1 unless version.is_a?(String) && !version.empty? && !version.include?(\"\\n\"); puts version' results/jq.json)\ntest -n \"$jq_version\"\n[ \"$(cat results/jq-list)\" = \"jq $jq_version\" ]\nreceipt=\"$(cat results/jq-cellar)/$jq_version/INSTALL_RECEIPT.json\"\ntest -s \"$receipt\"\n\"$portable_ruby\" -rjson -e 'receipt = JSON.parse(File.read(ARGV.fetch(0))); exit(receipt[\"poured_from_bottle\"] == true ? 0 : 1)' \"$receipt\"",
  "required_upstreams": ["formulae.brew.sh", "ghcr.io", "pkg-containers.githubusercontent.com", "github.com"]
}
