{
  "name": "registry-git-regression",
  "image": "katch/package-client-node:22.20.0",
  "setup": "set -eu\ntest ! -e repository && test ! -e results\nmkdir results",
  "run": "set -eu\nrepository_url=\"${KATCH_URL%/}/github.com/octocat/Hello-World.git\"\ncase \"$KATCH_PHASE\" in\ncold)\n  git clone \"$repository_url\" repository\n  git -C repository fsck --no-dangling\n  max_attempts=60\n  poll_interval=5\n  poll_timeout=300\n  request_timeout=15\n  deadline=$(($(date +%s) + poll_timeout))\n  attempt=1\n  local_ready=false\n  last_poll_trace=\n  last_poll_refs=\n  while [ \"$attempt\" -le \"$max_attempts\" ] && [ \"$(date +%s)\" -lt \"$deadline\" ]; do\n    poll_trace=\"results/cold-local-$attempt.trace\"\n    poll_refs=\"results/cold-local-$attempt.refs\"\n    last_poll_trace=$poll_trace\n    last_poll_refs=$poll_refs\n    remaining=$((deadline - $(date +%s)))\n    [ \"$remaining\" -gt 0 ] || break\n    call_timeout=$request_timeout\n    if [ \"$remaining\" -lt \"$call_timeout\" ]; then\n      call_timeout=$remaining\n    fi\n    if GIT_TRACE_CURL=1 timeout \"$call_timeout\" git ls-remote \"$repository_url\" HEAD > \"$poll_refs\" 2> \"$poll_trace\"; then\n      if tr -d '\\r' < \"$poll_trace\" | grep -Eiq '<= Recv header: X-Katch-Git: local$'; then\n        cp \"$poll_trace\" results/cold-local.trace\n        cp \"$poll_refs\" results/cold-local.refs\n        local_ready=true\n        break\n      fi\n    fi\n    attempt=$((attempt + 1))\n    remaining=$((deadline - $(date +%s)))\n    if [ \"$attempt\" -le \"$max_attempts\" ] && [ \"$remaining\" -gt 0 ]; then\n      if [ \"$remaining\" -gt \"$poll_interval\" ]; then\n        sleep \"$poll_interval\"\n      else\n        sleep \"$remaining\"\n      fi\n    fi\n  done\n  if [ \"$local_ready\" != true ]; then\n    echo \"Git mirror did not become local within ${poll_timeout}s after $attempt attempts\" >&2\n    echo \"last refs: $last_poll_refs\" >&2\n    cat \"$last_poll_refs\" >&2 || true\n    echo \"last trace: $last_poll_trace\" >&2\n    cat \"$last_poll_trace\" >&2 || true\n    exit 1\n  fi\n  ;;\nwarm)\n  GIT_TRACE_CURL=1 git clone \"$repository_url\" repository > results/warm-clone.stdout 2> results/warm-clone.trace\n  git -C repository fsck --no-dangling\n  ;;\n*)\n  echo \"unsupported KATCH_PHASE: $KATCH_PHASE\" >&2\n  exit 64\n  ;;\nesac",
  "assert": "set -eu\ntest -f repository/.git/HEAD\ngit -C repository rev-parse --verify HEAD >/dev/null\ncase \"$KATCH_PHASE\" in\ncold)\n  test -s results/cold-local.refs\n  tr -d '\\r' < results/cold-local.trace | grep -Eiq '<= Recv header: X-Katch-Git: local$'\n  ;;\nwarm)\n  test -s results/warm-clone.trace\n  tr -d '\\r' < results/warm-clone.trace | grep -Eiq '<= Recv header: X-Katch-Git: local$'\n  ;;\n*) exit 64 ;;\nesac",
  "required_upstreams": ["github.com"]
}
