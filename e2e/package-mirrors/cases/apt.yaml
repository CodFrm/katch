{
  "name": "apt-update-install-signature",
  "image": "katch/package-client-debian:12.11",
  "setup": "set -eu\nmirror=\"${KATCH_BASE_URL:-${KATCH_URL:-}}\"\ntest -n \"${mirror}\"\nrm -f /etc/apt/sources.list\nrm -f /etc/apt/sources.list.d/*\nprintf 'deb [signed-by=/usr/share/keyrings/debian-archive-keyring.gpg] %s/deb.debian.org/debian bookworm main\\n' \"${mirror%/}\" > /etc/apt/sources.list\nrm -rf /var/lib/apt/lists/*\nmkdir -p /var/lib/apt/lists/partial\n# \u6bcf\u4e2a\u9636\u6bb5\u90fd\u5fc5\u987b\u4ece\u300c\u8fd8\u6ca1\u88c5 hello\u300d\u5f00\u59cb\uff1a\u88c5\u8fc7\u7684\u8bdd apt-get install \u53ea\u4f1a\u6253\u5370\u4e00\u53e5\n# already the newest version \u5c31\u9000\u51fa\uff0c\u4e00\u4e2a\u5b57\u8282\u90fd\u4e0d\u4f20\u3002\u5199\u6210 if \u800c\u4e0d\u662f ! \u5f00\u5934\u7684\u7ba1\u9053\uff1a\n# set -e \u5bf9\u4ee5 ! \u5f00\u5934\u7684\u7ba1\u9053\u4e0d\u751f\u6548\uff0c\u90a3\u6837\u5199\u8fd9\u6761\u524d\u63d0\u6c38\u8fdc\u4e0d\u4f1a\u5931\u8d25\u3002\nif dpkg-query -W -f='${Status}\\n' hello 2>/dev/null | grep -qx 'install ok installed'; then\n  echo 'hello is already installed, so the phase would download nothing' >&2\n  exit 1\nfi\nif [ \"$KATCH_PHASE\" = warm ]; then\n  test -d \"$KATCH_SHARED/apt-lists\"\n  cp -a \"$KATCH_SHARED/apt-lists/.\" /var/lib/apt/lists/\nfi\n",
  "run": "set -eu\ncase $KATCH_PHASE in\n  cold)\n    apt-get -o Acquire::Retries=0 update > /tmp/apt-update.log 2>&1 || { cat /tmp/apt-update.log; exit 1; }\n    cat /tmp/apt-update.log\n    ;;\n  warm) ;;\n  *)\n    printf '%s\\n' \"unsupported phase: $KATCH_PHASE\" >&2\n    exit 64\n    ;;\nesac\ninrelease=\"$(find /var/lib/apt/lists -type f -name '*_InRelease' -print -quit)\"\ntest -n \"${inrelease}\"\ngpgv --keyring /usr/share/keyrings/debian-archive-keyring.gpg \"${inrelease}\" > /tmp/apt-signature.log 2>&1\nif [ \"$KATCH_PHASE\" = cold ]; then\n  mkdir -p \"$KATCH_SHARED/apt-lists\"\n  find /var/lib/apt/lists -maxdepth 1 -type f \\( -name '*_InRelease' -o -name '*_Packages*' \\) \\\n    -exec cp -a {} \"$KATCH_SHARED/apt-lists/\" ';'\nfi\napt-get -o Acquire::Retries=0 install -y --no-install-recommends hello > /tmp/apt-install.log 2>&1 || { cat /tmp/apt-install.log; exit 1; }\ncat /tmp/apt-install.log\n",
  "assert": "set -eu\ndpkg-query -W -f='${Status}\\n' hello | grep -qx 'install ok installed'\ngrep -q 'Good signature' /tmp/apt-signature.log\ninrelease=\"$(find /var/lib/apt/lists -type f -name '*_InRelease' -print -quit)\"\ntest -n \"${inrelease}\"\nshared=\"$KATCH_SHARED/apt-lists/$(basename \"${inrelease}\")\"\n# \u8fd9\u4e00\u9636\u6bb5\u771f\u7684\u7ecf katch \u53d6\u4e86\u90a3\u4e2a\u5305\u3002\u8bc1\u636e\u53ea\u80fd\u662f apt \u81ea\u5df1\u62a5\u7684 Get \u884c\uff1a\u955c\u50cf\u91cc\u7684\n# docker-clean \u88c5\u5b8c\u5c31\u628a .deb \u5220\u6389\uff0c\u800c dpkg \u7684\u72b6\u6001\u5206\u4e0d\u51fa\u300c\u521a\u88c5\u7684\u300d\u548c\u300c\u672c\u6765\u5c31\u6709\u300d\u3002\ngrep -Eq '^Get:[0-9]+ .*hello' /tmp/apt-install.log\nif grep -q 'is already the newest version' /tmp/apt-install.log; then\n  echo 'apt installed nothing: hello was already the newest version' >&2\n  exit 1\nfi\n# \u5171\u4eab\u76ee\u5f55\u53ea\u653e\u9a8c\u8fc7\u7b7e\u7684\u7d22\u5f15\uff1a\u4e0b\u8f7d\u7f13\u5b58\u4e0d\u5171\u4eab\uff0c\u6696\u9636\u6bb5\u7684\u5305\u5fc5\u987b\u771f\u4ece katch \u62ff\u3002\n[ -z \"$(find \"$KATCH_SHARED\" -name '*.deb' -print -quit)\" ]\ncase $KATCH_PHASE in\n  cold)\n    if grep -Eq 'NO_PUBKEY|BADSIG|EXPKEYSIG|The repository .* is not signed' /tmp/apt-update.log; then\n      echo 'apt reported a signature problem during update' >&2\n      exit 1\n    fi\n    test -s \"${shared}\"\n    ;;\n  warm)\n    # \u6696\u9636\u6bb5\u9a8c\u7b7e\u3001\u5b89\u88c5\u6240\u4f9d\u636e\u7684\u7d22\u5f15\uff0c\u9010\u5b57\u8282\u5c31\u662f\u51b7\u9636\u6bb5\u9a8c\u8fc7\u7b7e\u540e\u53d1\u5e03\u7684\u90a3\u4e00\u4efd\u3002\n    cmp \"${shared}\" \"${inrelease}\"\n    ;;\n  *)\n    printf '%s\\n' \"unsupported phase: $KATCH_PHASE\" >&2\n    exit 64\n    ;;\nesac\n",
  "required_upstreams": ["deb.debian.org"]
}
