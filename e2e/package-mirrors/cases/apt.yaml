{
  "name": "apt-update-install-signature",
  "image": "katch/package-client-debian:12.11",
  "setup": "set -eu\nmirror=\"${KATCH_BASE_URL:-${KATCH_URL:-}}\"\ntest -n \"${mirror}\"\nrm -f /etc/apt/sources.list\nrm -f /etc/apt/sources.list.d/*\nprintf 'deb [signed-by=/usr/share/keyrings/debian-archive-keyring.gpg] %s/deb.debian.org/debian bookworm main\\n' \"${mirror%/}\" > /etc/apt/sources.list\nrm -rf /var/lib/apt/lists/*\nmkdir -p /var/lib/apt/lists/partial\nif [ \"$KATCH_PHASE\" = warm ]; then\n  test -d \"$KATCH_SHARED/apt-lists\"\n  cp -a \"$KATCH_SHARED/apt-lists/.\" /var/lib/apt/lists/\nfi\n",
  "run": "set -eu\ncase $KATCH_PHASE in\n  cold)\n    apt-get -o Acquire::Retries=0 update 2>&1 | tee /tmp/apt-update.log\n    ;;\n  warm)\n    : > /tmp/apt-update.log\n    ;;\n  *)\n    printf '%s\\n' \"unsupported phase: $KATCH_PHASE\" >&2\n    exit 64\n    ;;\nesac\ninrelease=\"$(find /var/lib/apt/lists -type f -name '*_InRelease' -print -quit)\"\ntest -n \"${inrelease}\"\ngpgv --keyring /usr/share/keyrings/debian-archive-keyring.gpg \"${inrelease}\" > /tmp/apt-signature.log 2>&1\nif [ \"$KATCH_PHASE\" = cold ]; then\n  mkdir -p \"$KATCH_SHARED/apt-lists\"\n  find /var/lib/apt/lists -maxdepth 1 -type f \\( -name '*_InRelease' -o -name '*_Packages*' \\) \\\n    -exec cp -a {} \"$KATCH_SHARED/apt-lists/\" ';'\nfi\napt-get -o Acquire::Retries=0 install -y --no-install-recommends hello\n",
  "assert": "set -eu\ndpkg-query -W -f='${Status}\\n' hello | grep -qx 'install ok installed'\ngrep -q 'Good signature' /tmp/apt-signature.log\ninrelease=\"$(find /var/lib/apt/lists -type f -name '*_InRelease' -print -quit)\"\ntest -n \"${inrelease}\"\n[ -z \"$(find \"$KATCH_SHARED\" -name '*.deb' -print -quit)\" ]\ncase $KATCH_PHASE in\n  cold)\n    ! grep -Eq 'NO_PUBKEY|BADSIG|EXPKEYSIG|The repository .* is not signed' /tmp/apt-update.log\n    cmp \"$KATCH_SHARED/apt-lists/$(basename \"${inrelease}\")\" \"${inrelease}\"\n    ;;\n  warm)\n    test ! -s /tmp/apt-update.log\n    cmp \"$KATCH_SHARED/apt-lists/$(basename \"${inrelease}\")\" \"${inrelease}\"\n    ;;\n  *)\n    printf '%s\\n' \"unsupported phase: $KATCH_PHASE\" >&2\n    exit 64\n    ;;\nesac\n",
  "required_upstreams": ["deb.debian.org"]
}
