{
  "name": "maven-gradle-sbt",
  "image": "katch/package-client-jvm:2026-09-16",
  "setup": "set -eu\nfor tool in mvn gradle sbt; do\n  command -v \"$tool\" >/dev/null 2>&1 || { echo \"blocked: $tool is unavailable\" >&2; exit 69; }\ndone\nroot=$PWD/maven-clients\nrm -rf \"$root\"\nmkdir -p \"$PWD/client-home\"\nmkdir -p \"$root/maven/src/main/java/example\" \"$root/gradle/src/main/java/example\" \"$root/sbt/src/main/java/example\"\ncat > \"$root/Example.java\" <<'EOF'\npackage example;\nimport org.apache.commons.lang3.StringUtils;\npublic final class Example {\n  public static boolean blank(String value) { return StringUtils.isBlank(value); }\n}\nEOF\ncp \"$root/Example.java\" \"$root/maven/src/main/java/example/Example.java\"\ncp \"$root/Example.java\" \"$root/gradle/src/main/java/example/Example.java\"\ncp \"$root/Example.java\" \"$root/sbt/src/main/java/example/Example.java\"\ncat > \"$root/maven/pom.xml\" <<'EOF'\n<project xmlns=\"http://maven.apache.org/POM/4.0.0\">\n  <modelVersion>4.0.0</modelVersion>\n  <groupId>example</groupId><artifactId>maven-client</artifactId><version>1.0.0</version>\n  <properties><maven.compiler.release>11</maven.compiler.release></properties>\n  <dependencies><dependency><groupId>org.apache.commons</groupId><artifactId>commons-lang3</artifactId><version>3.17.0</version></dependency></dependencies>\n  <build><plugins><plugin><groupId>org.apache.maven.plugins</groupId><artifactId>maven-compiler-plugin</artifactId><version>3.13.0</version></plugin></plugins></build>\n</project>\nEOF\ncat > \"$root/maven/settings.xml\" <<EOF\n<settings><mirrors><mirror><id>katch</id><mirrorOf>*</mirrorOf><url>${KATCH_URL}/repo.maven.apache.org/maven2</url></mirror></mirrors></settings>\nEOF\ncat > \"$root/gradle/settings.gradle\" <<'EOF'\nrootProject.name = 'gradle-client'\nEOF\ncat > \"$root/gradle/build.gradle\" <<'EOF'\nplugins { id 'java' }\nrepositories { maven { url = uri(System.getenv('MAVEN_REPOSITORY_URL')) } }\ndependencies { implementation 'org.apache.commons:commons-lang3:3.17.0' }\nEOF\ncat > \"$root/sbt/build.sbt\" <<'EOF'\nThisBuild / scalaVersion := \"2.13.15\"\nCompile / unmanagedSourceDirectories += baseDirectory.value / \"src\" / \"main\" / \"java\"\nlibraryDependencies += \"org.apache.commons\" % \"commons-lang3\" % \"3.17.0\"\nEOF\ncat > \"$root/sbt/repositories\" <<EOF\n[repositories]\nlocal\nkatch: ${KATCH_URL}/repo.maven.apache.org/maven2\nEOF\n",
  "run": "set -eu\nexport HOME=\"$PWD/client-home\"\nroot=$PWD/maven-clients\n(cd \"$root/maven\" && mvn --batch-mode --no-transfer-progress --settings settings.xml compile)\n(cd \"$root/gradle\" && MAVEN_REPOSITORY_URL=\"${KATCH_URL}/repo.maven.apache.org/maven2\" gradle --no-daemon --console=plain compileJava)\n(cd \"$root/sbt\" && sbt -batch -Dsbt.override.build.repos=true -Dsbt.repository.config=\"$root/sbt/repositories\" compile)\n",
  "assert": "set -eu\nroot=$PWD/maven-clients\ntest -f \"$root/maven/target/classes/example/Example.class\"\ntest -f \"$root/gradle/build/classes/java/main/example/Example.class\"\ntest -f \"$root/sbt/target/scala-2.13/classes/example/Example.class\"\n",
  "required_upstreams": ["repo.maven.apache.org"]
}
