{
  "name": "pypi-family",
  "image": "katch/package-client-python:3.13.7",
  "setup": "set -eu\nmkdir -p pip uv poetry\npython -m venv pip/.venv\nuv venv uv/.venv\nprintf '%s\\n' '[tool.poetry]' 'name = \"katch-pypi-e2e\"' 'version = \"0.1.0\"' 'description = \"\"' 'authors = []' 'package-mode = false' '' '[tool.poetry.dependencies]' 'python = \">=3.11,<4.0\"' 'idna = \"3.10\"' > poetry/pyproject.toml",
  "run": "set -eu\n[ \"${KATCH_CLIENT_CA_CERT:-}\" = /run/katch-test-ca.crt ] || { echo 'pypi-family requires mounted test CA at /run/katch-test-ca.crt' >&2; exit 69; }\n[ -f \"$KATCH_CLIENT_CA_CERT\" ] && [ -r \"$KATCH_CLIENT_CA_CERT\" ] || { echo 'pypi-family test CA is not a readable regular file' >&2; exit 69; }\nindex=\"${KATCH_URL%/}/pypi.org/simple/\"\npip/.venv/bin/python -m pip install --disable-pip-version-check --no-cache-dir --cert \"$KATCH_CLIENT_CA_CERT\" --index-url \"$index\" idna==3.10\nuv --native-tls pip install --no-cache --python uv/.venv/bin/python --index-url \"$index\" idna==3.10\n(cd poetry\npoetry source remove katch >/dev/null 2>&1 || true\npoetry source add --priority=primary katch \"$index\"\npoetry config certificates.katch.cert \"$KATCH_CLIENT_CA_CERT\"\npoetry install --no-interaction --no-root)\npip/.venv/bin/python -m pip --version\nuv --version\npoetry --version",
  "assert": "set -eu\npip/.venv/bin/python -c 'import idna; assert idna.__version__ == \"3.10\"'\nuv/.venv/bin/python -c 'import idna; assert idna.__version__ == \"3.10\"'\n(cd poetry && poetry run python -c 'import idna; assert idna.__version__ == \"3.10\"')\nif grep -R -n -F 'https://pypi.org/' poetry/poetry.lock poetry/pyproject.toml 2>/dev/null; then\n  echo 'generated Poetry metadata leaked the public index' >&2\n  exit 1\nfi\n[ ! -e poetry/poetry.toml ] || { echo 'generated Poetry project metadata contains phase-local certificate configuration' >&2; exit 1; }\nif grep -n -F \"$KATCH_CLIENT_CA_CERT\" poetry/poetry.lock poetry/pyproject.toml 2>/dev/null; then\n  echo 'generated Poetry project metadata leaked the mounted test CA path' >&2\n  exit 1\nfi",
  "required_upstreams": ["pypi.org", "files.pythonhosted.org"]
}
