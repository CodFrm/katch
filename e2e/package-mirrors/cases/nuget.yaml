{
  "name": "nuget",
  "image": "katch/package-client-dotnet:8.0.414",
  "setup": "set -eu\nmkdir -p app\ncat > app/app.csproj <<'EOF'\n<Project Sdk=\"Microsoft.NET.Sdk\">\n  <PropertyGroup>\n    <OutputType>Exe</OutputType>\n    <TargetFramework>net8.0</TargetFramework>\n    <NuGetAudit>false</NuGetAudit>\n  </PropertyGroup>\n  <ItemGroup>\n    <PackageReference Include=\"Newtonsoft.Json\" Version=\"13.0.3\" />\n  </ItemGroup>\n</Project>\nEOF\nprintf '%s\\n' 'using System;' 'using Newtonsoft.Json;' 'Console.WriteLine(JsonConvert.SerializeObject(new { mirrored = true }));' > app/Program.cs\ncase $KATCH_PHASE in\n  cold) ;;\n  warm)\n    cat > app/packages.lock.json <<'EOF'\n{\n  \"version\": 1,\n  \"dependencies\": {\n    \"net8.0\": {\n      \"Newtonsoft.Json\": {\n        \"type\": \"Direct\",\n        \"requested\": \"[13.0.3, )\",\n        \"resolved\": \"13.0.3\",\n        \"contentHash\": \"HrC5BXdl00IP9zeV+0Z848QWPAoCr9P3bDEZguI+gkLcBKAOxix/tLEAAHC+UvDNPv4a2d18lOReHMOagPa+zQ==\"\n      }\n    }\n  }\n}\nEOF\n    ;;\n  *)\n    echo \"unsupported KATCH_PHASE: $KATCH_PHASE\" >&2\n    exit 64\n    ;;\nesac",
  "run": "set -eu\nexport DOTNET_CLI_TELEMETRY_OPTOUT=1\nexport NUGET_CERT_REVOCATION_MODE=offline\nexport NUGET_HTTP_CACHE_PATH=\"$KATCH_SHARED/nuget-http-cache\"\nsource_url=\"${KATCH_URL%/}/api.nuget.org/v3/index.json\"\ncase $KATCH_PHASE in\n  cold)\n    dotnet restore app/app.csproj --source \"$source_url\" --packages \"$PWD/packages\"\n    ;;\n  warm)\n    dotnet restore app/app.csproj --source \"$source_url\" --packages \"$PWD/packages\" --locked-mode\n    ;;\n  *)\n    echo \"unsupported KATCH_PHASE: $KATCH_PHASE\" >&2\n    exit 64\n    ;;\nesac\ndotnet package search Newtonsoft.Json --source \"$source_url\" --take 1 --format json > search.json\ndotnet --info",
  "assert": "set -eu\nexport DOTNET_CLI_TELEMETRY_OPTOUT=1\nexport NUGET_CERT_REVOCATION_MODE=offline\nshutdown_dotnet_build_servers() {\n  assertion_status=$?\n  trap - EXIT\n  shutdown_status=0\n  dotnet build-server shutdown || shutdown_status=$?\n  if [ \"$assertion_status\" -ne 0 ]; then\n    exit \"$assertion_status\"\n  fi\n  exit \"$shutdown_status\"\n}\ntrap shutdown_dotnet_build_servers EXIT\ntest -f packages/newtonsoft.json/13.0.3/newtonsoft.json.13.0.3.nupkg\ngrep -F 'Newtonsoft.Json' search.json\ndotnet run --project app/app.csproj --no-restore | grep -F '{\"mirrored\":true}'\nif grep -R -n -F 'https://api.nuget.org/' app/obj search.json 2>/dev/null; then\n  echo 'NuGet output leaked the public service index' >&2\n  exit 1\nfi",
  "required_upstreams": ["api.nuget.org", "nuget.azure.cn", "azuresearch-usnc.nuget.org", "azuresearch-ea.nuget.org", "azuresearch-sea.nuget.org", "globalcdn.nuget.org", "www.nuget.org"]
}
