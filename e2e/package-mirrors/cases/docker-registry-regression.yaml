{
  "name": "docker-registry-regression",
  "image": "katch/package-client-docker:29.2.1",
  "privileged": true,
  "setup": "set -eu\nfor tool in cmp docker dockerd grep install; do\n  command -v \"$tool\" >/dev/null 2>&1 || { echo \"required Docker regression tool unavailable: $tool\" >&2; exit 69; }\ndone\n[ -n \"${KATCH_CLIENT_CA_CERT:-}\" ] || { echo 'Docker registry regression requires KATCH_CA_CERT' >&2; exit 69; }\ntest ! -e results && test ! -e docker-data && test ! -e docker-exec\nmkdir results\nregistry_ca=\"/etc/docker/certs.d/${KATCH_HOST}:${KATCH_PORT}/ca.crt\"\ninstall -d \"${registry_ca%/*}\"\ninstall -m 0644 \"$KATCH_CLIENT_CA_CERT\" \"$registry_ca\"\ncmp -s \"$KATCH_CLIENT_CA_CERT\" \"$registry_ca\"",
  "run": "set -eu\nexport DOCKER_HOST=unix:///run/katch-docker.sock\nimage_ref=\"${KATCH_HOST}:${KATCH_PORT}/ghcr.io/stefanprodan/podinfo:6.9.2\"\ndockerd_pid=\nstop_dockerd() {\n  [ -n \"$dockerd_pid\" ] || return 0\n  kill -TERM \"$dockerd_pid\"\n  attempt=0\n  while kill -0 \"$dockerd_pid\" 2>/dev/null; do\n    attempt=$((attempt + 1))\n    if [ \"$attempt\" -ge 60 ]; then\n      echo 'dockerd did not stop cleanly within 30 seconds' >&2\n      return 1\n    fi\n    sleep 0.5\n  done\n  wait \"$dockerd_pid\"\n  dockerd_pid=\n}\ntrap stop_dockerd EXIT HUP INT TERM\ndockerd --host=unix:///run/katch-docker.sock --data-root=\"$PWD/docker-data\" --exec-root=\"$PWD/docker-exec\" --pidfile=\"$PWD/dockerd.pid\" --storage-driver=vfs --bridge=none --iptables=false > results/dockerd.log 2>&1 &\ndockerd_pid=$!\nattempt=0\nuntil docker info > results/docker-info.txt 2>&1; do\n  kill -0 \"$dockerd_pid\" 2>/dev/null || { cat results/dockerd.log >&2; exit 1; }\n  attempt=$((attempt + 1))\n  if [ \"$attempt\" -ge 60 ]; then\n    echo 'docker info did not succeed within 30 seconds' >&2\n    cat results/dockerd.log >&2\n    exit 1\n  fi\n  sleep 0.5\ndone\ndocker pull \"$image_ref\" > results/pull.txt\nrepo_reference=$(docker image inspect --format '{{index .RepoDigests 0}}' \"$image_ref\")\ncase \"$repo_reference\" in\n  \"${image_ref%:*}\"@sha256:*) ;;\n  *) echo \"unexpected Docker RepoDigest: $repo_reference\" >&2; exit 1 ;;\nesac\nrepo_digest=${repo_reference##*@}\nmanifest_digest=$repo_digest\nimage_id=$(docker image inspect --format '{{.Id}}' \"$image_ref\")\nprintf '%s\\n' \"$repo_reference\" > results/repo-reference\nprintf '%s\\n' \"$repo_digest\" > results/repo-digest\nprintf '%s\\n' \"$manifest_digest\" > results/manifest-digest\nprintf '%s\\n' \"$image_id\" > results/image-id\ndocker run --rm --network none --dns 127.0.0.1 --entrypoint ./podinfo \"$image_ref\" --version > results/version\nstop_dockerd\ntrap - EXIT HUP INT TERM",
  "assert": "set -eu\nartifact_katch_ip=$(awk -v host=\"$KATCH_HOST\" '\n  $1 ~ /^[0-9]+([.][0-9]+){3}$/ {\n    for (field = 2; field <= NF; field++) {\n      if ($field ~ /^#/) break\n      if ($field == host) { print $1; exit }\n    }\n  }\n' \"$KATCH_ARTIFACTS/hosts\")\ncase \"$artifact_katch_ip\" in\n  ''|*[!0-9.]*) echo \"missing exact static Katch hosts evidence: $KATCH_HOST\" >&2; exit 1 ;;\nesac\ntest -s \"$KATCH_ARTIFACTS/hosts\"\ntest -s \"$KATCH_ARTIFACTS/resolv.conf.before\"\nexpected_resolver=$(printf '%s\\n' 'nameserver 127.0.0.1' 'options timeout:1 attempts:1')\n[ \"$(cat \"$KATCH_ARTIFACTS/resolv.conf.after\")\" = \"$expected_resolver\" ]\ncmp -s \"$KATCH_ARTIFACTS/resolv.conf.after\" /etc/resolv.conf\nassert_sha256() {\n  file=$1\n  [ \"$(wc -l < \"$file\" | tr -d ' ')\" -eq 1 ]\n  grep -Eq '^sha256:[a-f0-9]{64}$' \"$file\"\n}\nassert_sha256 results/repo-digest\nassert_sha256 results/manifest-digest\nassert_sha256 results/image-id\n[ \"$(cat results/repo-digest)\" = \"$(cat results/manifest-digest)\" ]\n[ \"$(wc -l < results/repo-reference | tr -d ' ')\" -eq 1 ]\ngrep -Eq \"^${KATCH_HOST}:${KATCH_PORT}/ghcr[.]io/stefanprodan/podinfo@sha256:[a-f0-9]{64}$\" results/repo-reference\n[ \"$(wc -l < results/version | tr -d ' ')\" -eq 1 ]\n[ \"$(cat results/version)\" = '6.9.2' ]\ntest -s results/docker-info.txt\ntest -s results/pull.txt",
  "required_upstreams": ["ghcr.io", "pkg-containers.githubusercontent.com"]
}
