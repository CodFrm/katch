{
  "name": "podman-registry-regression",
  "image": "katch/package-client-podman:5.6.2",
  "privileged": true,
  "setup": "set -eu\nfor tool in cmp grep install podman; do\n  command -v \"$tool\" >/dev/null 2>&1 || { echo \"required Podman regression tool unavailable: $tool\" >&2; exit 69; }\ndone\n[ -n \"${KATCH_CLIENT_CA_CERT:-}\" ] || { echo 'Podman registry regression requires KATCH_CA_CERT' >&2; exit 69; }\ntest ! -e results && test ! -e podman-root && test ! -e podman-runroot\nmkdir results\nregistry_ca=\"/etc/containers/certs.d/${KATCH_HOST}:${KATCH_PORT}/ca.crt\"\ninstall -d \"${registry_ca%/*}\"\ninstall -m 0644 \"$KATCH_CLIENT_CA_CERT\" \"$registry_ca\"\ncmp -s \"$KATCH_CLIENT_CA_CERT\" \"$registry_ca\"",
  "run": "set -eu\nimage_ref=\"${KATCH_HOST}:${KATCH_PORT}/ghcr.io/stefanprodan/podinfo:6.9.1\"\npodman_client() {\n  podman --root \"$PWD/podman-root\" --runroot \"$PWD/podman-runroot\" --storage-driver=vfs --events-backend=file \"$@\"\n}\npodman_client info > results/podman-info.txt\npodman_client pull \"$image_ref\" > results/pull.txt\nrepo_references=$(podman_client image inspect --format '{{range .RepoDigests}}{{printf \"%s\\n\" .}}{{end}}' \"$image_ref\")\n[ -n \"$repo_references\" ] || { echo 'Podman returned no RepoDigests' >&2; exit 1; }\nsource_index_reference=$(printf '%s\\n' \"$repo_references\" | awk 'NR == 1 { print; exit }')\ncase \"$source_index_reference\" in\n  \"${image_ref%:*}\"@sha256:*) ;;\n  *) echo \"unexpected Podman source index RepoDigest: $source_index_reference\" >&2; exit 1 ;;\nesac\nsource_index_digest=${source_index_reference##*@}\nselected_manifest_digest=$(podman_client image inspect --format '{{.Digest}}' \"$image_ref\")\nprintf '%s\\n' \"$repo_references\" | LC_ALL=C sort > results/repo-digests\nprintf '%s\\n' \"$source_index_digest\" > results/source-index-digest\nprintf '%s\\n' \"$selected_manifest_digest\" > results/selected-manifest-digest\npodman_client run --rm --network none --entrypoint ./podinfo \"$image_ref\" --version > results/version",
  "assert": "set -eu\nartifact_katch_ip=$(awk -v host=\"$KATCH_HOST\" '\n  $1 ~ /^[0-9]+([.][0-9]+){3}$/ {\n    for (field = 2; field <= NF; field++) {\n      if ($field ~ /^#/) break\n      if ($field == host) { print $1; exit }\n    }\n  }\n' \"$KATCH_ARTIFACTS/hosts\")\ncase \"$artifact_katch_ip\" in\n  ''|*[!0-9.]*) echo \"missing exact static Katch hosts evidence: $KATCH_HOST\" >&2; exit 1 ;;\nesac\ntest -s \"$KATCH_ARTIFACTS/hosts\"\ntest -s \"$KATCH_ARTIFACTS/resolv.conf.before\"\nexpected_resolver=$(printf '%s\\n' 'nameserver 127.0.0.1' 'options timeout:1 attempts:1')\n[ \"$(cat \"$KATCH_ARTIFACTS/resolv.conf.after\")\" = \"$expected_resolver\" ]\ncmp -s \"$KATCH_ARTIFACTS/resolv.conf.after\" /etc/resolv.conf\nassert_sha256() {\n  file=$1\n  [ \"$(wc -l < \"$file\" | tr -d ' ')\" -eq 1 ]\n  grep -Eq '^sha256:[a-f0-9]{64}$' \"$file\"\n}\nassert_sha256 results/source-index-digest\nassert_sha256 results/selected-manifest-digest\n[ \"$(cat results/source-index-digest)\" != \"$(cat results/selected-manifest-digest)\" ]\nrepo_digest_count=$(wc -l < results/repo-digests | tr -d ' ')\n[ \"$repo_digest_count\" -ge 2 ]\nexpected_repo_name=\"${image_ref%:*}\"\nwhile IFS= read -r repo_reference; do\n  case \"$repo_reference\" in\n    \"$expected_repo_name\"@sha256:*) ;;\n    *) echo \"unexpected Podman RepoDigest: $repo_reference\" >&2; exit 1 ;;\n  esac\n  printf '%s\\n' \"${repo_reference##*@}\" | grep -Eq '^sha256:[a-f0-9]{64}$'\ndone < results/repo-digests\nsource_index_reference=\"$expected_repo_name@$(cat results/source-index-digest)\"\nselected_manifest_reference=\"$expected_repo_name@$(cat results/selected-manifest-digest)\"\n[ \"$(grep -Fxc \"$source_index_reference\" results/repo-digests || true)\" -eq 1 ]\n[ \"$(grep -Fxc \"$selected_manifest_reference\" results/repo-digests || true)\" -eq 1 ]\n[ \"$(wc -l < results/version | tr -d ' ')\" -eq 1 ]\n[ \"$(cat results/version)\" = '6.9.1' ]\ntest -s results/podman-info.txt\ntest -s results/pull.txt",
  "required_upstreams": ["ghcr.io", "pkg-containers.githubusercontent.com"]
}
