{
  "name": "podman-registry-regression",
  "image": "katch/package-client-podman:5.6.2",
  "privileged": true,
  "setup": "set -eu\nfor tool in cmp grep install podman; do\n  command -v \"$tool\" >/dev/null 2>&1 || { echo \"required Podman regression tool unavailable: $tool\" >&2; exit 69; }\ndone\n[ -n \"${KATCH_CLIENT_CA_CERT:-}\" ] || { echo 'Podman registry regression requires KATCH_CA_CERT' >&2; exit 69; }\ntest ! -e results && test ! -e podman-root && test ! -e podman-runroot\nmkdir results\nregistry_ca=\"/etc/containers/certs.d/${KATCH_HOST}:${KATCH_PORT}/ca.crt\"\ninstall -d \"${registry_ca%/*}\"\ninstall -m 0644 \"$KATCH_CLIENT_CA_CERT\" \"$registry_ca\"\ncmp -s \"$KATCH_CLIENT_CA_CERT\" \"$registry_ca\"",
  "run": "set -eu\nimage_ref=\"${KATCH_HOST}:${KATCH_PORT}/ghcr.io/stefanprodan/podinfo:6.9.1\"\npodman_client() {\n  podman --root \"$PWD/podman-root\" --runroot \"$PWD/podman-runroot\" --storage-driver=vfs --events-backend=file \"$@\"\n}\npodman_client info > results/podman-info.txt\npodman_client pull \"$image_ref\" > results/pull.txt\nrepo_reference=$(podman_client image inspect --format '{{index .RepoDigests 0}}' \"$image_ref\")\ncase \"$repo_reference\" in\n  \"${image_ref%:*}\"@sha256:*) ;;\n  *) echo \"unexpected Podman RepoDigest: $repo_reference\" >&2; exit 1 ;;\nesac\nrepo_digest=${repo_reference##*@}\nimage_digest=$(podman_client image inspect --format '{{.Digest}}' \"$image_ref\")\nprintf '%s\\n' \"$repo_reference\" > results/repo-reference\nprintf '%s\\n' \"$repo_digest\" > results/repo-digest\nprintf '%s\\n' \"$image_digest\" > results/image-digest\npodman_client run --rm --network none --entrypoint ./podinfo \"$image_ref\" --version > results/version",
  "assert": "set -eu\nartifact_katch_ip=$(awk -v host=\"$KATCH_HOST\" '\n  $1 ~ /^[0-9]+([.][0-9]+){3}$/ {\n    for (field = 2; field <= NF; field++) {\n      if ($field ~ /^#/) break\n      if ($field == host) { print $1; exit }\n    }\n  }\n' \"$KATCH_ARTIFACTS/hosts\")\ncase \"$artifact_katch_ip\" in\n  ''|*[!0-9.]*) echo \"missing exact static Katch hosts evidence: $KATCH_HOST\" >&2; exit 1 ;;\nesac\ntest -s \"$KATCH_ARTIFACTS/hosts\"\ntest -s \"$KATCH_ARTIFACTS/resolv.conf.before\"\nexpected_resolver=$(printf '%s\\n' 'nameserver 127.0.0.1' 'options timeout:1 attempts:1')\n[ \"$(cat \"$KATCH_ARTIFACTS/resolv.conf.after\")\" = \"$expected_resolver\" ]\ncmp -s \"$KATCH_ARTIFACTS/resolv.conf.after\" /etc/resolv.conf\nassert_sha256() {\n  file=$1\n  [ \"$(wc -l < \"$file\" | tr -d ' ')\" -eq 1 ]\n  grep -Eq '^sha256:[a-f0-9]{64}$' \"$file\"\n}\nassert_sha256 results/repo-digest\nassert_sha256 results/image-digest\n[ \"$(cat results/repo-digest)\" = \"$(cat results/image-digest)\" ]\n[ \"$(wc -l < results/repo-reference | tr -d ' ')\" -eq 1 ]\ngrep -Eq \"^${KATCH_HOST}:${KATCH_PORT}/ghcr[.]io/stefanprodan/podinfo@sha256:[a-f0-9]{64}$\" results/repo-reference\n[ \"$(wc -l < results/version | tr -d ' ')\" -eq 1 ]\n[ \"$(cat results/version)\" = '6.9.1' ]\ntest -s results/podman-info.txt\ntest -s results/pull.txt",
  "required_upstreams": ["ghcr.io", "pkg-containers.githubusercontent.com"]
}
