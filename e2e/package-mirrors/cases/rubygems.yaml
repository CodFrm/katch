{
  "name": "rubygems-bundler",
  "image": "katch/package-client-ruby:3.4.5",
  "setup": "set -eu\nmirror=\"${KATCH_URL%/}/rubygems.org/\"\nmkdir -p gem-home bundler/vendor/bundle bundler/vendor/cache\nprintf \"source '%s'\\ngem 'rake', '13.2.1'\\n\" \"$mirror\" > bundler/Gemfile\nif [ \"$KATCH_PHASE\" = warm ]; then\n  printf 'GEM\\n  remote: %s\\n  specs:\\n    rake (13.2.1)\\n\\nPLATFORMS\\n  ruby\\n  x86_64-linux\\n\\nDEPENDENCIES\\n  rake (= 13.2.1)\\n\\nBUNDLED WITH\\n   2.7.1\\n' \"$mirror\" > bundler/Gemfile.lock\nfi",
  "run": "set -eu\nmirror=\"${KATCH_URL%/}/rubygems.org/\"\ncase $KATCH_PHASE in\n  cold)\n    GEM_HOME=\"$PWD/gem-home\" GEM_PATH= gem install rake --version 13.2.1 --no-document --clear-sources --source \"$mirror\"\n    BUNDLE_GEMFILE=\"$PWD/bundler/Gemfile\" BUNDLE_PATH=\"$PWD/bundler/vendor/bundle\" BUNDLE_DISABLE_SHARED_GEMS=true bundle install\n    ;;\n  warm)\n    gem_file=$PWD/rake-13.2.1.gem\n    ruby -rrubygems/remote_fetcher -e 'File.binwrite(ARGV.fetch(1), Gem::RemoteFetcher.fetcher.fetch_path(ARGV.fetch(0)))' \"${mirror}gems/rake-13.2.1.gem\" \"$gem_file\"\n    GEM_HOME=\"$PWD/gem-home\" GEM_PATH= gem install --local \"$gem_file\" --no-document\n    cp \"$gem_file\" bundler/vendor/cache/rake-13.2.1.gem\n    BUNDLE_GEMFILE=\"$PWD/bundler/Gemfile\" BUNDLE_PATH=\"$PWD/bundler/vendor/bundle\" BUNDLE_DISABLE_SHARED_GEMS=true BUNDLE_FROZEN=true bundle install --local\n    ;;\n  *)\n    printf '%s\\n' \"unsupported phase: $KATCH_PHASE\" >&2\n    exit 64\n    ;;\nesac",
  "assert": "set -eu\nGEM_HOME=\"$PWD/gem-home\" GEM_PATH= \"$PWD/gem-home/bin/rake\" --version\nBUNDLE_GEMFILE=\"$PWD/bundler/Gemfile\" BUNDLE_PATH=\"$PWD/bundler/vendor/bundle\" BUNDLE_DISABLE_SHARED_GEMS=true bundle exec ruby -e 'abort unless Gem.loaded_specs.fetch(\"rake\").version.to_s == \"13.2.1\"'",
  "required_upstreams": ["rubygems.org"]
}
