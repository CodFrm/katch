{
  "name": "composer-dist",
  "image": "katch/package-client-composer:2.9.5",
  "setup": "set -eu\nmkdir -p /tmp/katch-composer\ncd /tmp/katch-composer\ncat > composer.json <<'JSON'\n{\n  \"require\": {\n    \"psr/log\": \"3.0.2\"\n  },\n  \"config\": {\n    \"preferred-install\": \"dist\"\n  }\n}\nJSON",
  "run": "set -eu\ncd /tmp/katch-composer\ncomposer config --global repos.packagist composer \"${KATCH_BASE_URL}/repo.packagist.org\"\ncomposer config --global notify-on-install false\ntest \"$(composer config --global notify-on-install)\" = false\ncomposer install --prefer-dist --no-dev --no-interaction --no-progress --no-security-blocking",
  "assert": "set -eu\ncd /tmp/katch-composer\ntest -f vendor/psr/log/src/LoggerInterface.php\ncomposer show --locked psr/log | grep -F 'versions' | grep -F '3.0.2'",
  "required_upstreams": [
    "repo.packagist.org",
    "api.github.com",
    "codeload.github.com"
  ]
}
