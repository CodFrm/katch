{
  "name": "npm-family",
  "image": "katch/package-client-node:22.20.0",
  "setup": "set -eu\nfor client in npm pnpm yarn-classic yarn-berry bun; do\n  mkdir -p \"$client\"\n  printf '%s\\n' '{\"name\":\"katch-e2e\",\"private\":true,\"dependencies\":{\"is-number\":\"7.0.0\"}}' > \"$client/package.json\"\ndone",
  "run": "set -eu\nregistry=\"${KATCH_URL%/}/registry.npmjs.org/\"\n(cd npm && npm install --ignore-scripts --registry=\"$registry\" --replace-registry-host=always)\n(cd pnpm && pnpm install --ignore-scripts --registry=\"$registry\")\n(cd yarn-classic && yarn install --ignore-scripts --registry \"$registry\")\n(cd yarn-berry && yarn-berry config set npmRegistryServer \"$registry\" && yarn-berry install --mode=skip-builds)\n(cd bun && bun install --ignore-scripts --registry \"$registry\")\nnpm --version\npnpm --version\nyarn --version\nyarn-berry --version\nbun --version",
  "assert": "set -eu\nnode -e 'if (!require(\"./npm/node_modules/is-number\")(7)) process.exit(1)'\nnode -e 'if (!require(\"./pnpm/node_modules/is-number\")(7)) process.exit(1)'\nnode -e 'if (!require(\"./yarn-classic/node_modules/is-number\")(7)) process.exit(1)'\n(cd yarn-berry && yarn-berry node -e 'if (!require(\"is-number\")(7)) process.exit(1)')\nnode -e 'if (!require(\"./bun/node_modules/is-number\")(7)) process.exit(1)'\nif grep -R -n -F 'https://registry.npmjs.org/' npm/package-lock.json pnpm/pnpm-lock.yaml yarn-classic/yarn.lock yarn-berry/yarn.lock bun/bun.lock 2>/dev/null; then\n  echo 'generated lockfile leaked the public registry; old public lockfiles must be regenerated or use host replacement' >&2\n  exit 1\nfi",
  "required_upstreams": ["registry.npmjs.org"]
}
