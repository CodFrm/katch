# katch 的配置。
#
# 是 Secret 不是 ConfigMap：里面有 admin.initialKey 和数据库 DSN，两样都是凭据，
# 而 ConfigMap 在很多集群里是默认可读的。
#
# **apply 之前必须改掉 admin.initialKey**：
#   openssl rand -hex 24
#
# 这份东西入库就带着占位密钥，所以真要长期维护的话，别把改完的这个文件提交回来——
# 用 kustomize 的 secretGenerator 从集群外的文件生成，或者换成 External Secrets /
# Sealed Secrets 之类。
apiVersion: v1
kind: Secret
metadata:
  name: katch
  labels:
    app.kubernetes.io/name: katch
    app.kubernetes.io/instance: katch
type: Opaque
stringData:
  # 键名必须是 config.yaml：整个 Secret 被当目录挂到 /app/configs 下，
  # 而镜像的 ENTRYPOINT 默认读 ./configs/config.yaml。
  config.yaml: |
    # debug 决定 gin 的模式（cago 的 mux.HTTP 只看这一个字段，不看 env）。
    # 留 true 会给每个请求多打一行日志——一次 docker pull 是几十上百个请求。
    env: prod
    debug: false
    # source 不能省，cago 的 Config.init() 会无条件读这个键。
    source: file

    http:
      address:
        - "0.0.0.0:8080"

    logger:
      level: info
      # 不关 console：kubectl logs 是排障的第一现场。
      disableConsole: false
      logFile:
        # 关掉就只剩 stdout：kubectl logs 拿不到历史，捞旧日志要进节点上的文件。
        enable: true
        # 落在数据卷里：根文件系统是只读的，日志只能写这个挂载点。
        filename: ./data/logs/katch.log
        errorFilename: ./data/logs/katch.err.log

    db:
      driver: "sqlite"
      # 三个 pragma 都不能省：WAL 让读不阻塞写，busy_timeout 让遇锁时等待
      # 而不是立刻返回 SQLITE_BUSY，synchronous(NORMAL) 免得每次提交都 fsync
      # 一次、在缓存大文件写盘时一卡几秒（理由见 configs/config.yaml.example）。
      dsn: "file:./data/katch.db?_pragma=journal_mode(WAL)&_pragma=busy_timeout(5000)&_pragma=synchronous(NORMAL)"
      prefix: "katch_"
      debug: false
      maxOpenConns: 8
      maxIdleConns: 4
      connMaxLifetime: 30m
      connMaxIdleTime: 5m

    cache:
      # cache/ 和 logs/ 进程自己建，但 ./data 本身必须存在——sqlite 不建父目录。
      # /app/data 是挂载点，所以正常情况下总是在的。
      dir: ./data/cache

    admin:
      # ↓↓↓ 改掉它 ↓↓↓
      initialKey: "change-me-before-exposing-katch"
