{{- if not .Values.existingSecret }}
# 配置装在 Secret 而不是 ConfigMap：里面有 admin.initialKey 和数据库 DSN，
# 两样都是凭据。ConfigMap 在很多集群里是默认可读的。
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "katch.fullname" . }}
  labels:
    {{- include "katch.labels" . | nindent 4 }}
type: Opaque
stringData:
  # 键名必须是 config.yaml：它被整个 Secret 当目录挂到 /app/configs 下，
  # 而镜像的 ENTRYPOINT 默认读 ./configs/config.yaml。自带 Secret 时同理。
  config.yaml: |
    {{- include "katch.configYaml" . | nindent 4 }}
{{- end }}
