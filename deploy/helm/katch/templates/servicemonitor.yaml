{{- if .Values.metrics.serviceMonitor.enabled }}
# 需要集群里装了 Prometheus Operator（monitoring.coreos.com/v1）。
# 界面上的命中率不依赖它：那是库里的分钟桶（决策 16），装不装都不影响后台能看。
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "katch.fullname" . }}
  labels:
    {{- include "katch.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "katch.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      # /metrics 由 cago 的 metric 组件自动挂载，katch 这边没有开关。
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.metrics.serviceMonitor.scrapeTimeout }}
      {{- with .Values.metrics.serviceMonitor.relabelings }}
      relabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.metrics.serviceMonitor.metricRelabelings }}
      metricRelabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
